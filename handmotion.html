<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hand-Controlled 3D Particle System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
            opacity: 0.8;
        }
        #input-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror the video */
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 24px; text-shadow: 0 0 10px #00ffcc; }
        p { margin: 5px 0; font-size: 14px; opacity: 0.8; }
        .highlight { color: #fff; font-weight: bold; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            transition: opacity 0.5s;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>Particle Gestures</h1>
        <p>🖐 <span class="highlight">Move Hand</span> to Interact</p>
        <p>👌 <span class="highlight">Pinch (Index+Thumb)</span> to Change Shape</p>
        <p>✊ <span class="highlight">Close Fist</span> to Explode/Color</p>
        <p>  2 <open class ="highlight">open circle<
        </p>
        <p id="status-text">Status: Loading Models...</p>
    </div>

    <div id="loading">Initializing AI & Graphics...</div>

    <div id="video-container">
        <video id="input-video" playsinline></video>
    </div>

<script>
    // --- CONFIGURATION ---
    const PARTICLE_COUNT = 15000;
    const PARTICLE_SIZE = 0.15;
    const CANVAS_WIDTH = window.innerWidth;
    const CANVAS_HEIGHT = window.innerHeight;
    
    // --- THREE.JS VARIABLES ---
    let scene, camera, renderer, particles, geometry, material;
    let positions, colors, targetPositions;
    let clock = new THREE.Clock();
    
    // --- INTERACTION VARIABLES ---
    let handPosition = new THREE.Vector3(0, 0, 0);
    let isHandDetected = false;
    let isPinching = false;
    let isFist = false;
    let currentShapeIndex = 0;
    let colorSchemeIndex = 0;
    let lastPinchTime = 0;

    // --- SHAPE DEFINITIONS ---
    const SHAPES = ['sphere', 'heart', 'saturn', 'flower', 'torus'];

    function init() {
        // Scene Setup
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        camera = new THREE.PerspectiveCamera(75, CANVAS_WIDTH / CANVAS_HEIGHT, 0.1, 1000);
        camera.position.z = 30;

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(CANVAS_WIDTH, CANVAS_HEIGHT);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Particle System Setup
        geometry = new THREE.BufferGeometry();
        positions = new Float32Array(PARTICLE_COUNT * 3);
        colors = new Float32Array(PARTICLE_COUNT * 3);
        targetPositions = new Float32Array(PARTICLE_COUNT * 3);

        // Initialize particles in a random cloud first
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;

            colors[i * 3] = 0;
            colors[i * 3 + 1] = 1;
            colors[i * 3 + 2] = 1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Shader Material for better performance and visual look
        const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/disc.png');
        material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            map: sprite,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
            opacity: 0.8
        });

        particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Generate initial shape targets
        generateShape('sphere');
        
        // Resize Listener
        window.addEventListener('resize', onWindowResize, false);

        // Start Animation Loop
        animate();
    }

    // --- SHAPE GENERATION LOGIC ---
    function generateShape(type) {
        const scale = 12;
        const pts = [];

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            let x, y, z;
            
            if (type === 'sphere') {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                x = scale * Math.cos(theta) * Math.sin(phi);
                y = scale * Math.sin(theta) * Math.sin(phi);
                z = scale * Math.cos(phi);
            } 
            else if (type === 'heart') {
                // Heart parametric equation
                const t = Math.random() * Math.PI * 2;
                const r = Math.random(); // volume filler
                // Basic 2D heart shape extruded slightly
                // x = 16sin^3(t)
                // y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
                let hx = 16 * Math.pow(Math.sin(t), 3);
                let hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                
                // Scale down logic
                x = hx * 0.8 * r;
                y = hy * 0.8 * r;
                z = (Math.random() - 0.5) * 5; // Thickness
            }
            else if (type === 'saturn') {
                const r = Math.random();
                if (i < PARTICLE_COUNT * 0.3) {
                    // Planet Body
                    const phi = Math.acos(-1 + (2 * i) / (PARTICLE_COUNT * 0.3));
                    const theta = Math.sqrt((PARTICLE_COUNT * 0.3) * Math.PI) * phi;
                    x = (scale * 0.6) * Math.cos(theta) * Math.sin(phi);
                    y = (scale * 0.6) * Math.sin(theta) * Math.sin(phi);
                    z = (scale * 0.6) * Math.cos(phi);
                } else {
                    // Rings
                    const angle = Math.random() * Math.PI * 2;
                    const radius = (scale * 0.8) + Math.random() * (scale * 0.8);
                    x = Math.cos(angle) * radius;
                    z = Math.sin(angle) * radius;
                    y = (Math.random() - 0.5) * 0.5; // Thin ring
                    
                    // Tilt the ring
                    const tilt = 0.4;
                    const tempY = y * Math.cos(tilt) - z * Math.sin(tilt);
                    const tempZ = y * Math.sin(tilt) + z * Math.cos(tilt);
                    y = tempY;
                    z = tempZ;
                }
            }
            else if (type === 'flower') {
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI;
                // Rose curve inspired
                const k = 3; // Petals
                const r = scale * Math.cos(k * u);
                x = r * Math.cos(u) * Math.sin(v);
                y = r * Math.sin(u) * Math.sin(v);
                z = scale * 0.5 * Math.cos(v);
            }
            else if (type === 'torus') {
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI * 2;
                const R = 10;
                const r = 3;
                x = (R + r * Math.cos(v)) * Math.cos(u);
                y = (R + r * Math.cos(v)) * Math.sin(u);
                z = r * Math.sin(v);
            }

            targetPositions[i * 3] = x;
            targetPositions[i * 3 + 1] = y;
            targetPositions[i * 3 + 2] = z;
        }
        
        document.getElementById('status-text').innerText = `Shape: ${type.toUpperCase()}`;
    }

    // --- COLOR MANAGEMENT ---
    function updateColors() {
        const time = Date.now() * 0.001;
        const colorAttr = geometry.attributes.color;
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            let r, g, b;
            
            if (colorSchemeIndex === 0) { // Cyan/Purple
                r = 0.5 + 0.5 * Math.sin(time + positions[i*3] * 0.1);
                g = 0.2;
                b = 1.0;
            } else if (colorSchemeIndex === 1) { // Fire
                r = 1.0;
                g = 0.5 + 0.5 * Math.sin(time + positions[i*3+1] * 0.2);
                b = 0.0;
            } else { // Matrix Green
                r = 0.0;
                g = 1.0;
                b = 0.2 + 0.5 * Math.cos(time + i);
            }

            colorAttr.setXYZ(i, r, g, b);
        }
        colorAttr.needsUpdate = true;
    }

    // --- ANIMATION LOOP ---
    function animate() {
        requestAnimationFrame(animate);

        const posAttr = geometry.attributes.position;
        const time = Date.now() * 0.0005;

        // Easing factor for movement towards shape
        // If Fist is clenched, particles explode outward (ignore target)
        const lerpFactor = isFist ? 0.01 : 0.05; 
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            let ix = i * 3;
            let iy = i * 3 + 1;
            let iz = i * 3 + 2;

            let px = posAttr.array[ix];
            let py = posAttr.array[iy];
            let pz = posAttr.array[iz];

            let tx = targetPositions[ix];
            let ty = targetPositions[iy];
            let tz = targetPositions[iz];

            // 1. Move towards target shape
            if (!isFist) {
                px += (tx - px) * lerpFactor;
                py += (ty - py) * lerpFactor;
                pz += (tz - pz) * lerpFactor;
            } else {
                // Explosion logic
                px += (Math.random() - 0.5) * 1.5;
                py += (Math.random() - 0.5) * 1.5;
                pz += (Math.random() - 0.5) * 1.5;
            }

            // 2. Hand Interaction (Repulsion/Attraction)
            if (isHandDetected) {
                // Map hand 2D (0-1) to 3D world space roughly
                // Camera is at z=30. Screen roughly -20 to 20 xy
                const handX = (handPosition.x - 0.5) * -50; // Invert X for mirror effect
                const handY = (handPosition.y - 0.5) * -35;
                const handZ = 10; 

                const dx = px - handX;
                const dy = py - handY;
                const dz = pz - handZ;
                
                const distSq = dx*dx + dy*dy + dz*dz;
                const minDist = 100; // Radius of interaction

                if (distSq < minDist) {
                    const dist = Math.sqrt(distSq);
                    const force = (minDist - dist) / minDist;
                    
                    // Repel
                    px += (dx / dist) * force * 2;
                    py += (dy / dist) * force * 2;
                    pz += (dz / dist) * force * 2;
                }
            }
            
            // Rotation for idle animation
            if (!isHandDetected) {
                const rotSpeed = 0.002;
                const ox = px;
                const oz = pz;
                px = ox * Math.cos(rotSpeed) - oz * Math.sin(rotSpeed);
                pz = ox * Math.sin(rotSpeed) + oz * Math.cos(rotSpeed);
            }

            posAttr.array[ix] = px;
            posAttr.array[iy] = py;
            posAttr.array[iz] = pz;
        }

        posAttr.needsUpdate = true;
        
        updateColors();
        
        // Gentle scene rotation
        scene.rotation.y += 0.001;

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- MEDIAPIPE SETUP ---
    const videoElement = document.getElementById('input-video');

    function onResults(results) {
        // Hide loading text once tracking starts
        document.getElementById('loading').style.display = 'none';

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            isHandDetected = true;
            const landmarks = results.multiHandLandmarks[0];

            // 1. Get Hand Position (Index Finger Tip - Landmark 8)
            handPosition.set(landmarks[8].x, landmarks[8].y, 0);

            // 2. Detect Pinch (Thumb Tip 4 vs Index Tip 8)
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const distance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) + 
                Math.pow(thumbTip.y - indexTip.y, 2)
            );

            // Pinch Threshold
            if (distance < 0.05) {
                if (!isPinching && Date.now() - lastPinchTime > 1000) {
                    // Trigger Shape Switch
                    isPinching = true;
                    lastPinchTime = Date.now();
                    currentShapeIndex = (currentShapeIndex + 1) % SHAPES.length;
                    generateShape(SHAPES[currentShapeIndex]);
                }
            } else {
                isPinching = false;
            }

            // 3. Detect Fist (Check if fingertips are close to wrist)
            // Simple heuristic: Are Index(8), Middle(12), Ring(16) close to Wrist(0)?
            const wrist = landmarks[0];
            const middleTip = landmarks[12];
            const fistDist = Math.sqrt(
                Math.pow(wrist.x - middleTip.x, 2) + 
                Math.pow(wrist.y - middleTip.y, 2)
            );

            if (fistDist < 0.15) {
                isFist = true;
                // Switch colors on fist hold sometimes
                if (Math.random() > 0.95) colorSchemeIndex = (colorSchemeIndex + 1) % 3;
            } else {
                isFist = false;
            }

        } else {
            isHandDetected = false;
            isFist = false;
        }
    }

    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({image: videoElement});
        },
        width: 640,
        height: 480
    });

    // Start Everything
    init();
    cameraUtils.start();

</script>
</body>
</html>
