<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetMatric</title>
<link rel="stylesheet" href="leetcodeproject.css">
</head>
<body>
    
    <div class="container">
        <h1>LeetMatric</h1>
        <div class="usercontainer">
            <p>enter your username :</p>
           <div class="user-input-container">
               <input type="text" placeholder="Enter your username" id="user-input">
               <button id="search-btn">Submit</button>
           </div>
        </div>

           <div class="states-container">
            <div class="progress">
                <div class="progresssitem circle">
                    <div class="easy-prograss">
                        <span id="easy-label"></span>
                        easy
                    </div>
                </div>
                <div class="progresssitem circle">
                    <div class="medium-prograss">
                        <span id="medium-label"></span>
                        medium
                    </div>
                </div>
                <div class="progresssitem circle">
                    <div class="hard-prograss">
                        <span id="hard-label"></span>
                        hard
                    </div>
                </div>
            </div>
           
            <div class="states-cards">

            </div>
        </div>
        </div>

    
    <script src ="leetcodeproject.js"></script>
</body>
</html>
