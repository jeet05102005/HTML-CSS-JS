<!DOCTYPE html>
<html>
<head>
<style>
.traffic-light {
  width: 80px;
  background: #000000;
  padding: 5px;
  border-radius: 5px;
  margin: 50px auto;
}

.light {
  width: 50px;
  height: 50px;
  background: #555;
  margin: 10px auto;
  border-radius: 500%;
}

/* Colors */
.red {
  background: red;
}
.yellow {
  background: yellow;
}
.green {
  background: green;
}
</style>
</head>
<body>

<div class="traffic-light">
  <div class="light red"></div>
  <div class="light yellow"></div>
  <div class="light green"></div>
</div>

</body>
</html>
